      ...D.outgoing.map((m,i)=>h('div',{c:'card'},h('div',{c:'row'},

        h('div',{c:'acts'},h('button',{c:'x',on:{click:()=>{D.outgoing.splice(i,1);save();render()}}},T.delete))
      )))
    ];
  },
  letters(){
    const T=L();
    const templates=[{title:'Official Invitation',body:'Your Excellency,\n\nOn behalf of the Ambassador of the Arab Republic of Egypt, I have the honour to invite you to…\n\nDate:\nTime:\nVenue:\n\nRespectfully,\nOffice of the Ambassador'},{title:'Meeting Confirmation',body:'Dear [Name],\n\nThis confirms the meeting with the Ambassador on [date] at [time].\n\nOffice of the Ambassador'},{title:'Thank-You Letter',body:'Dear [Name],\n\nOn behalf of the Ambassador, please accept our thanks for…\n\nRespectfully,\nOffice of the Ambassador'}];
    const F={sub:h('input',{type:'text',placeholder:'Subject'}),body:h('textarea',{style:'min-height:120px',placeholder:'Body'})};
    return [
      h('div',{c:'card paper'},h('h2',{html:IC.pen+' Templates'}),
        h('div',{style:'display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px'},
          ...templates.map(t=>h('div',{c:'tpl',on:{click:()=>{F.sub.value=t.title;F.body.value=t.body}}},h('b',{},t.title)))
        )
      ),
      h('div',{c:'card'},h('h2',{},'Draft'),
        h('form',{},h('label',{c:'wide'},'Subject',F.sub),h('label',{c:'wide'},'Body',F.body),
          h('div',{c:'acts wide'},
            h('button',{c:'btn',type:'button',on:{click:()=>{if(!F.sub.value&&!F.body.value)return;D.corr.unshift({id:uid(),sub:F.sub.value,body:F.body.value,at:Date.now()});save();render();toast('Saved')}}},T.save),
            h('button',{c:'btn b',type:'button',on:{click:()=>sendMail(F.sub.value,F.body.value)}},T.email),
            h('button',{c:'btn w',type:'button',on:{click:()=>sendWA((F.sub.value?F.sub.value+'\n\n':'')+F.body.value)}},T.whatsapp),
            h('button',{c:'btn s ghost',type:'button',on:{click:()=>cp((F.sub.value?F.sub.value+'\n\n':'')+F.body.value)}},T.copy)
          )
        )
      ),
      ...D.corr.slice(0,4).map((c,i)=>h('div',{c:'card'},h('div',{c:'row'},
        h('div',{},h('b',{},c.sub||'(No subject)')),
        h('div',{c:'acts'},h('button',{c:'btn s',on:{click:()=>{F.sub.value=c.sub;F.body.value=c.body}}},T.load),h('button',{c:'x',on:{click:()=>{D.corr.splice(i,1);save();render()}}},T.delete))
      )))
    ];
  },
  contacts(){
    const T=L();const F={name:h('input'),org:h('input'),role:h('input'),phone:h('input',{type:'tel'}),email:h('input',{type:'email'}),notes:h('textarea',{placeholder:'Notes'})};
    return [
      h('div',{c:'card'},h('h2',{html:IC.users+' Contacts'}),
        h('form',{},h('label',{},'Name',F.name),h('label',{},'Organisation',F.org),h('label',{},'Role',F.role),h('label',{},'Phone',F.phone),h('label',{},'Email',F.email),h('label',{c:'wide'},'Notes',F.notes),
          h('button',{c:'btn wide',type:'button',on:{click:()=>{if(!F.name.value)return toast('Name required');D.contacts.unshift({id:uid(),name:F.name.value,org:F.org.value,role:F.role.value,phone:F.phone.value,email:F.email.value,notes:F.notes.value});save();render();toast('Added')}}},T.add)
        )
      ),
      ...D.contacts.map((c,i)=>h('div',{c:'card ct-card'},h('div',{c:'row'},
        h('div',{},h('b',{},c.name),h('div',{c:'m'},[c.role,c.org].filter(Boolean).join(' · ')),c.phone?h('div',{c:'m'},c.phone):'',c.email?h('div',{c:'m'},c.email):''),
        h('div',{c:'acts'},
          c.email?h('button',{c:'btn s b',on:{click:()=>sendMail('','',c.email)}},T.email):'',
          c.phone?h('button',{c:'btn w s',on:{click:()=>sendWA('Hello '+c.name,c.phone)}},T.whatsapp):'',
          h('button',{c:'x',on:{click:()=>{D.contacts.splice(i,1);save();render()}}},T.delete)
        )
      )))
    ];
  },
  files(){
    const T=L();const levels=['Public','Internal','Confidential','Secret'];
    const drop=h('div',{c:'drop'},h('div',{style:'font-weight:700;margin-bottom:3px'},'Upload files'),h('div',{c:'m'},'PDF, DOCX, images'),h('input',{type:'file',multiple:true}));
    const inp=drop.querySelector('input');drop.onclick=()=>inp.click();
    drop.ondragover=e=>e.preventDefault();
    drop.ondrop=e=>{e.preventDefault();handleFiles(e.dataTransfer.files)};
    function handleFiles(list){[...list].forEach(file=>{const r=new FileReader();r.onload=()=>{D.docs.unshift({id:uid(),name:file.name,size:file.size,level:'Internal',at:Date.now(),data:r.result});save();render();toast(file.name)};r.readAsDataURL(file)})}
    inp.onchange=()=>handleFiles(inp.files);
    const PF={ref:h('input',{placeholder:'Ref'}),title:h('input',{placeholder:'Title'}),loc:h('input',{placeholder:'Cabinet / Shelf'}),date:h('input',{type:'date'}),level:h('select',{},...levels.map(l=>h('option',{value:l},l))),notes:h('input',{placeholder:'Notes'})};
    PF.date.value=tday();
    return [
      h('div',{c:'card'},h('h2',{html:IC.file+' Electronic'}),drop),
      ...D.docs.map((d,i)=>h('div',{c:'card'},h('div',{c:'row'},
        h('div',{},h('b',{},d.name),h('div',{c:'m'},((d.size/1024)|0)+' KB'),h('div',{style:'margin-top:4px'},h('span',{c:'lvl '+d.level},d.level))),
        h('div',{c:'acts'},h('button',{c:'btn s',on:{click:()=>{if(d.data){const a=document.createElement('a');a.href=d.data;a.download=d.name;a.click()}}}},'Download'),h('button',{c:'x',on:{click:()=>{D.docs.splice(i,1);save();render()}}},T.delete))
      ))),
      h('div',{c:'card'},h('h2',{},'Physical Log'),
        h('form',{},h('label',{},'Ref',PF.ref),h('label',{},'Title',PF.title),h('label',{},'Location',PF.loc),h('label',{},'Date',PF.date),h('label',{},'Level',PF.level),h('label',{c:'wide'},'Notes',PF.notes),
          h('button',{c:'btn wide',type:'button',on:{click:()=>{if(!PF.ref.value||!PF.title.value)return toast('Required');D.physical.unshift({id:uid(),ref:PF.ref.value,title:PF.title.value,loc:PF.loc.value,date:PF.date.value,level:PF.level.value,notes:PF.notes.value,at:Date.now()});save();render();toast('Logged')}}},T.save)
        )
      ),
      ...D.physical.map((p,i)=>h('div',{c:'card'},h('div',{c:'row'},
        h('div',{},h('b',{},p.ref+' — '+p.title),h('div',{c:'m'},(p.loc||'—')+' · '+p.date)),
        h('div',{c:'acts'},h('button',{c:'x',on:{click:()=>{D.physical.splice(i,1);save();render()}}},T.delete))
      )))
    ];
  },
  protocol(){
    const T=L();const items=D.protocol;const done=items.filter(p=>p.done).length;
    const V={name:h('input',{placeholder:'Name'}),org:h('input',{placeholder:'Organisation'}),purpose:h('input',{placeholder:'Purpose'}),date:h('input',{type:'date'}),timeIn:h('input',{type:'time'}),host:h('input',{placeholder:'Host'})};
    V.date.value=tday();
    return [
      h('div',{c:'card'},h('h2',{html:IC.shield+' Checklist · '+done+'/'+items.length}),
        ...items.map((p,i)=>h('div',{c:'check-item'+(p.done?' done':'')},
          h('input',{type:'checkbox',checked:p.done?true:null,on:{change:()=>{p.done=!p.done;save();render()}}}),
          h('span',{style:'flex:1;font-size:14px'},p.t),
          h('button',{c:'x',on:{click:()=>{items.splice(i,1);save();render()}}},T.remove)
        )),
        h('div',{style:'margin-top:10px;display:flex;gap:8px'},
          h('input',{type:'text',id:'newProto',placeholder:'New item',style:'flex:1'}),
          h('button',{c:'btn s',on:{click:()=>{const el=document.getElementById('newProto');if(!el||!el.value.trim())return;items.push({id:uid(),t:el.value.trim(),done:false});save();render()}}},T.add)
        )
      ),
      h('div',{c:'card'},h('h2',{},'Visitors'),
        h('form',{},h('label',{},'Name',V.name),h('label',{},'Organisation',V.org),h('label',{},'Purpose',V.purpose),h('label',{},'Date',V.date),h('label',{},'In',V.timeIn),h('label',{},'Host',V.host),
          h('button',{c:'btn wide',type:'button',on:{click:()=>{if(!V.name.value)return toast('Name required');D.visitors.unshift({id:uid(),name:V.name.value,org:V.org.value,purpose:V.purpose.value,date:V.date.value,timeIn:V.timeIn.value,host:V.host.value,at:Date.now()});save();render();toast('Logged')}}},T.save)
        )
      ),
      ...D.visitors.slice(0,10).map((v,i)=>h('div',{c:'card'},h('div',{c:'row'},
        h('div',{},h('b',{},v.name),h('div',{c:'m'},[v.org,v.purpose].filter(Boolean).join(' · ')),h('div',{c:'m'},v.date+' '+(v.timeIn||''))),
        h('div',{c:'acts'},h('button',{c:'x',on:{click:()=>{D.visitors.splice(i,1);save();render()}}},T.delete))
      )))
    ];
  },
  notes(){
    const T=L();const t=h('textarea',{placeholder:'Action note…'});
    const priority=h('select',{},h('option',{value:'Normal'},'Normal'),h('option',{value:'Important'},'Important'),h('option',{value:'Urgent'},'Urgent'));
    const colors=['','pink','green','blue'];
    return [
      h('div',{c:'card'},h('h2',{html:IC.note+' Action Notes'}),t,
        h('div',{style:'display:flex;gap:10px;align-items:flex-end;margin-top:10px;flex-wrap:wrap'},
          h('label',{style:'min-width:110px'},'Priority',priority),
          h('button',{c:'btn',on:{click:()=>{if(!t.value.trim())return;D.notes.unshift({t:t.value,p:priority.value,at:Date.now()});save();render()}}},T.save)
        )
      ),
      h('div',{style:'display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:11px'},
        ...D.notes.map((n,i)=>h('div',{c:'note-card '+colors[i%4]},
          h('span',{c:'pill'+(n.p==='Urgent'?' r':n.p==='Important'?' o':''),style:'margin-bottom:7px'},n.p||'Normal'),
          h('div',{style:'font-size:13.5px;white-space:pre-wrap;margin:7px 0'},n.t),
          h('div',{c:'acts'},h('button',{c:'btn s ghost',on:{click:()=>cp(n.t)}},T.copy),h('button',{c:'x',on:{click:()=>{D.notes.splice(i,1);save();render()}}},T.delete))
        ))
      )
    ];
  },
  report(){
    const T=L();const an=analytics();
    const report=()=>{const w=weekRange();let t='WEEKLY REPORT\nEmbassy of Egypt — Washington D.C.\n'+w.from+' → '+w.to+'\n\nMeetings this week: '+an.thisWeek+'\nThis month: '+an.thisMonth+'\nDone: '+an.done+' | Pending: '+an.pending+'\n\nOffice of the Ambassador';return t};
    return [
      h('div',{c:'stats'},
        h('div',{},h('b',{},String(an.thisWeek)),h('span',{},T.week)),
        h('div',{},h('b',{},String(an.thisMonth)),h('span',{},'Month')),
        h('div',{},h('b',{},String(an.done)),h('span',{},'Done')),
        h('div',{},h('b',{},String(an.pending)),h('span',{},'Pending'))
      ),
      h('div',{c:'card'},h('h2',{html:IC.chart+' Upcoming'}),
        ...(an.upcoming.length?an.upcoming.map(m=>h('div',{c:'row',style:'margin-bottom:8px'},
          h('div',{},h('b',{},m.title),h('div',{c:'m'},m.date+' · '+m.start)),
          h('div',{c:'acts',style:'margin:0'},...shareRow('Meeting',mTxt(m)))
        )):[h('p',{c:'m'},'None')])
      ),
      h('div',{c:'card'},h('h2',{},'Export'),
        h('div',{c:'acts'},
          h('button',{c:'btn',on:{click:()=>{cp(report());toast('Copied')}}},T.copy),
          h('button',{c:'btn w',on:{click:()=>sendWA(report())}},T.whatsapp),
          h('button',{c:'btn b',on:{click:()=>sendMail('Weekly Report — Embassy of Egypt',report())}},T.email)
        )
      )
    ];
  },
  set(){
    const T=L();
    const w=h('input',{type:'tel',placeholder:'+1 …',value:D.cfg.wa||''});
    const m=h('input',{type:'email',placeholder:'email@…',value:D.cfg.mail||''});
    const p=h('input',{type:'password',placeholder:'New password'});
    return [
      h('div',{c:'card'},h('h2',{html:IC.gear+' Settings'}),
        h('form',{},
          h('label',{},'WhatsApp (one-click)',w),
          h('label',{},'Email (one-click)',m),
          h('label',{c:'wide'},'Password',p),
          h('button',{c:'btn wide',type:'button',on:{click:async()=>{
            D.cfg.wa=w.value;D.cfg.mail=m.value;
            if(p.value.length>=4)D.cfg.pw=await hash(p.value);
            save();toast('Saved');
          }}},T.save)
        )
      )
    ];
  }
};

const TABS=[
  ['home','home',()=>L().home],['meet','cal',()=>L().meet],['mail','mail',()=>L().mail],
  ['letters','pen',()=>L().letters],['contacts','users',()=>L().contacts],['files','file',()=>L().files],
  ['protocol','shield',()=>L().protocol],['notes','note',()=>L().notes],['report','chart',()=>L().report],
  ['info','pin',()=>L().info],['set','gear',()=>L().set]
];

function render(){
  if(!open){lock();return}
  document.documentElement.lang=D.cfg.lang||'en';
  document.documentElement.dir=D.cfg.lang==='ar'?'rtl':'ltr';
  const r=$('#root');const y=window.scrollY;r.innerHTML='';
  const T=L();
  r.append(
    h('header',{},
      h('div',{c:'mascot',html:IC.eagle}),
      h('h1',{},'Aidy'),
      h('span',{c:'sub'},T.sub),
      h('div',{c:'hdr-bar'},
        h('button',{c:'tb',on:{click:()=>{document.body.classList.toggle('dark');toast(document.body.classList.contains('dark')?'Dark':'Light')}},html:IC.moon+' '+T.theme}),
        h('button',{c:'tb',on:{click:toggleLang},html:IC.lang+' '+T.lang})
      )
    ),
    h('nav',{},...TABS.map(([k,ico,lab])=>
      h('button',{c:k===tab?'on':'',on:{click:()=>{tab=k;render();scrollTo(0,0)}},html:IC[ico]+'<span>'+lab()+'</span>'})
    ))
  );
  const v=views[tab]();
  r.append(...(Array.isArray(v)?v:[v]));
  r.append(h('div',{c:'foot'},
    h('div',{},'Embassy of the Arab Republic of Egypt · Washington D.C. · Local only'),
    h('div',{c:'designer'},'Designed & Implemented by Hesham Al Haddad'),
    h('div',{style:'font-size:11px;color:var(--mut)'},'B.Sc. Information Systems · PG Diploma in Human Resources')
  ));
  scrollTo(0,y);
}
if(D.cfg.pw){open=false;lock()}else render();
</script>
</body>
</html>
